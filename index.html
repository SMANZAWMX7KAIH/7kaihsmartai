<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7KAIH SMART AI</title>
    <meta name="description" content="Platform cerdas pendamping 7 Kebiasaan Anak Indonesia Hebat bagi siswa SMA dilengkapi asisten Google Gemini, pelacak harian, gamifikasi penghargaan, dan dashboard guru." />
    <meta property="og:title" content="7KAIH SMART AI" />
    <meta property="og:description" content="Platform cerdas pendamping 7 Kebiasaan Anak Indonesia Hebat bagi siswa SMA dilengkapi asisten Google Gemini, pelacak harian, gamifikasi penghargaan, dan dashboard guru." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // 1. Bersihkan service worker lama di domain agar tidak melayani cache usang
        try {
          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
        } catch (e) {}

        var lastErrorMessage = '';
        function showFallback(title, message, detail) {
          var root = document.getElementById('root');
          if (root && !root.getAttribute('data-loaded')) {
            var detailHtml = detail ? '<div style="margin:0.75rem 0;padding:0.625rem;background:#f1f5f9;border-radius:0.75rem;font-family:monospace;font-size:0.6875rem;color:#b91c1c;text-align:left;word-break:break-all;max-height:100px;overflow-y:auto;">' + detail + '</div>' : '';
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif;text-align:center;">' +
              '<div style="max-width:400px;width:100%;background:#ffffff;border-radius:1.5rem;padding:2rem 1.5rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.06);border:1px solid #fecaca;">' +
                '<div style="width:56px;height:56px;border-radius:1rem;background:linear-gradient(135deg,#dc2626,#e11d48);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.5rem;margin:0 auto 1rem;box-shadow:0 8px 16px -4px rgba(220,38,38,0.3);">7K</div>' +
                '<span style="font-size:0.6875rem;font-weight:800;color:#dc2626;background:#fee2e2;padding:0.25rem 0.625rem;border-radius:9999px;display:inline-block;margin-bottom:0.5rem;letter-spacing:0.05em;">🇮🇩 7KAIH SMART AI</span>' +
                '<h2 style="font-size:1.125rem;font-weight:800;color:#0f172a;margin:0 0 0.5rem;">' + title + '</h2>' +
                '<p style="font-size:0.8125rem;color:#64748b;line-height:1.5;margin:0 0 1rem;">' + message + '</p>' +
                detailHtml +
                '<div style="display:flex;flex-direction:column;gap:0.5rem;">' +
                  '<button onclick="window.location.reload(true);" style="width:100%;padding:0.75rem 1rem;background:linear-gradient(to right,#dc2626,#e11d48);color:#ffffff;border:none;border-radius:0.75rem;font-weight:800;font-size:0.8125rem;cursor:pointer;">Muat Ulang Halaman</button>' +
                '</div>' +
              '</div>' +
            '</div>';
          }
        }

        // Tangkap kegagalan unduh skrip utama atau error runtime fatal
        window.addEventListener('error', function(event) {
          var target = event.target || event.srcElement;
          var isScript = target && target.tagName === 'SCRIPT';
          var srcUrl = target && target.src ? target.src : '';
          var isRawTsx = srcUrl.indexOf('main.tsx') !== -1;

          if (isRawTsx) {
            showFallback(
              'Publikasi GitHub Pages Perlu Diatur',
              'GitHub Pages sedang memuat kode sumber mentah (bukan hasil build folder <strong>dist</strong>).<br><br><strong>Solusi:</strong> Buka tab <em>Settings &gt; Pages &gt; Build and deployment</em> di repositori GitHub Anda, lalu ubah <strong>Source</strong> menjadi <strong>GitHub Actions</strong>.',
              srcUrl
            );
            return;
          }

          if (isScript) {
            lastErrorMessage = 'Gagal memuat berkas skrip: ' + srcUrl;
            showFallback('Gagal Mengunduh Aset Aplikasi', 'Terjadi kendala jaringan saat mengunduh berkas aplikasi. Silakan tekan tombol di bawah untuk memuat ulang.', lastErrorMessage);
          } else if (event.message) {
            lastErrorMessage = event.message;
            var root = document.getElementById('root');
            if (root && !root.getAttribute('data-loaded')) {
              showFallback('Kendala Inisialisasi', 'Terjadi kesalahan saat memulai aplikasi. Silakan muat ulang halaman.', event.message);
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? (event.reason.message || String(event.reason)) : 'Promise ditolak';
          lastErrorMessage = reason;
          var root = document.getElementById('root');
          if (root && !root.getAttribute('data-loaded')) {
            showFallback('Kendala Inisialisasi', 'Aplikasi memerlukan pembaruan cache peramban. Silakan muat ulang halaman.', reason);
          }
        });

        // Bantuan koneksi lambat setelah 12 detik tanpa merusak tampilan loading
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && !root.getAttribute('data-loaded')) {
            var slowNotice = document.getElementById('loading-slow-notice');
            if (slowNotice) {
              slowNotice.style.display = 'block';
            }
          }
        }, 12000);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-red-600 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; background: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; text-align: center;">
        <div style="max-width: 380px; width: 100%; background: #ffffff; border-radius: 1.5rem; padding: 2rem 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
          <div style="width: 56px; height: 56px; border-radius: 1rem; background: linear-gradient(135deg, #dc2626, #e11d48); color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.5rem; margin: 0 auto 1rem; box-shadow: 0 8px 16px -4px rgba(220, 38, 38, 0.3);">
            7K
          </div>
          <span style="font-size: 0.6875rem; font-weight: 800; color: #dc2626; background: #fee2e2; padding: 0.25rem 0.625rem; border-radius: 9999px; display: inline-block; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
            🇮🇩 7KAIH SMART AI
          </span>
          <h2 style="font-size: 1.125rem; font-weight: 800; color: #0f172a; margin: 0 0 0.5rem; letter-spacing: -0.02em;">
            Memuat Aplikasi...
          </h2>
          <p style="font-size: 0.8125rem; color: #64748b; line-height: 1.5; margin: 0 0 1.25rem;">
            7 Kebiasaan Anak Indonesia Hebat sedang disiapkan untukmu.
          </p>
          <div style="width: 32px; height: 32px; border: 3px solid #fecaca; border-top-color: #dc2626; border-radius: 50%; margin: 0 auto; animation: spin 0.8s linear infinite;"></div>
          <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          <div id="loading-slow-notice" style="display: none; margin-top: 1.25rem; padding-top: 0.875rem; border-top: 1px dashed #e2e8f0;">
            <p style="font-size: 0.75rem; color: #64748b; margin: 0 0 0.5rem;">
              Koneksi internet lambat atau cache sedang diproses?
            </p>
            <button onclick="window.location.reload(true);" style="padding: 0.375rem 0.75rem; background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 700; cursor: pointer;">
              Segarkan Halaman
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
